<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Product Detail</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .detail-container { border: 1px solid #ddd; padding: 20px; border-radius: 5px; max-width: 600px; }
        .detail-row { margin-bottom: 10px; }
        .label { font-weight: bold; }
        .back-link { display: inline-block; margin-top: 20px; text-decoration: none; color: #007bff; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Product Details</h1>
    <div class="detail-container">
        <div class="detail-row">
            <span class="label">ID:</span> {product.id}
        </div>
        <div class="detail-row">
            <span class="label">Name:</span> {product.name}
        </div>
        <div class="detail-row">
            <span class="label">SKU:</span> {product.sku}
        </div>
        <div class="detail-row">
            <span class="label">Price:</span> {product.price}
        </div>
        <div class="detail-row">
            <span class="label">Stock Quantity:</span> {product.stockQuantity}
        </div>
        <div class="detail-row">
            <span class="label">Category:</span> {product.category}
        </div>
        <div class="detail-row">
            <span class="label">Status:</span> {product.status}
        </div>
        <div class="detail-row">
            <span class="label">Description:</span> {product.description}
        </div>
    </div>
    <a href="/products-page" class="back-link">Back to List</a>
</body>
</html>
