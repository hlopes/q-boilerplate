<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        body { font-family: sans-serif; margin: 40px; text-align: center; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #d9534f; font-size: 3em; }
        p { font-size: 1.2em; }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{status} - {error}</h1>
        <p>{message}</p>
        <hr style="margin: 20px 0;">
        <p><a href="/products-page">Back to Product List</a></p>
    </div>
</body>
</html>
