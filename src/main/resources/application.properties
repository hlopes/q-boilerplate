# ================================================
# Application Configuration
# ================================================
quarkus.application.name=quarkus-app
quarkus.application.version=1.0.0

# ================================================
# HTTP Server
# ================================================
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Request-ID
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=24H

# ================================================
# Datasource (PostgreSQL - default/prod)
# ================================================
quarkus.datasource.db-kind=postgresql

# ================================================
# Hibernate ORM / Panache
# ================================================
quarkus.hibernate-orm.generation=none
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=false

# ================================================
# Flyway Migrations
# ================================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true

# ================================================
# Security / JWT
# ================================================
mp.jwt.verify.publickey.location=classpath:META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=${JWT_ISSUER:https://example.com/issuer}
quarkus.smallrye-jwt.enabled=true

# ================================================
# OpenAPI / Swagger UI
# ================================================
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi
mp.openapi.extensions.smallrye.info.title=Quarkus App API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Production-ready Quarkus microservice API
mp.openapi.extensions.smallrye.info.contact.name=API Team
mp.openapi.extensions.smallrye.info.contact.email=api@example.com

# ================================================
# Health Checks
# ================================================
quarkus.health.extensions.enabled=true
quarkus.smallrye-health.root-path=/health

# ================================================
# Metrics (Micrometer / Prometheus)
# ================================================
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# ================================================
# OpenTelemetry Tracing
# ================================================
quarkus.otel.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_ENDPOINT:http://localhost:4317}

# ================================================
# Caching
# ================================================
quarkus.cache.caffeine."user-cache".maximum-size=500
quarkus.cache.caffeine."user-cache".expire-after-write=5M
quarkus.cache.caffeine."product-cache".maximum-size=1000
quarkus.cache.caffeine."product-cache".expire-after-write=10M

# ================================================
# Logging
# ================================================
quarkus.log.level=INFO
quarkus.log.category."com.example".level=DEBUG
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.json=false

# ================================================
# Custom Application Properties
# ================================================
app.pagination.default-page-size=20
app.pagination.max-page-size=100
app.security.token-expiry-minutes=60

# ================================================
# OIDC Properties
# ================================================
quarkus.oidc.provider=google
quarkus.oidc.client-id=${OIDC_GOOGLE_CLIENT_ID}
quarkus.oidc.credentials.secret=${OIDC_GOOGLE_CLIENT_SECRET}
quarkus.oidc.application-type=web-app
# Set the redirect URI to the standard OIDC callback path
quarkus.oidc.authentication.scopes=openid,email,profile,https://www.googleapis.com/auth/calendar.readonly
quarkus.oidc.authentication.redirect-path=/q/oidc/callback
# Restore original path after callback and clean code/state params
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.remove-redirect-parameters=true
# Make Quarkus call Google UserInfo endpoint so we can rely on enriched claims
quarkus.oidc.authentication.user-info-required=true
# Minimal security: everything requires auth except assets and the landing page
quarkus.http.auth.permission.public.paths=/assets/*,/
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.app.paths=/*
quarkus.http.auth.permission.app.policy=authenticated
# REST Client base URLs for Google APIs
# People API (profile alias), Calendar API
quarkus.rest-client.google-people.url=https://people.googleapis.com
quarkus.rest-client.google-calendar.url=https://www.googleapis.com

# ================================================
# DEV Profile
# ================================================
%dev.quarkus.hibernate-orm.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.flyway.migrate-at-start=true
%dev.quarkus.log.console.json=false
%dev.quarkus.log.category."com.example".level=DEBUG
%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.otel.enabled=false
# %dev.quarkus.datasource.username=${DB_USERNAME:app_user}
# %dev.quarkus.datasource.password=${DB_PASSWORD:app_password}
# %dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/appdb}
# %dev.quarkus.datasource.jdbc.min-size=5
# %dev.quarkus.datasource.jdbc.max-size=20

# ================================================
# TEST Profile
# ================================================
%test.quarkus.hibernate-orm.generation=drop-and-create
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.otel.enabled=false
%test.quarkus.log.level=WARN
%test.quarkus.log.category."com.example".level=INFO

# ================================================
# PROD Profile
# ================================================
%prod.quarkus.swagger-ui.always-include=false
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.log.level=WARN
%prod.quarkus.log.category."com.example".level=INFO
